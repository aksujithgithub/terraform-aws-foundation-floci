name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow deploy.yml to call this workflow as a required gate
  workflow_call:
    outputs:
      validated:
        description: "Whether validation passed"
        value: ${{ jobs.validate.outputs.validated }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.validate.outcome == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "1.0.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive modules/

      - name: Terragrunt validate
        id: validate
        run: |
          terragrunt run --all validate \
            --working-dir environments/local \
            --non-interactive \
            --config root.hcl

  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint (modules/network)
        run: tflint --chdir=modules/network

      - name: Run TFLint (modules/iam)
        run: tflint --chdir=modules/iam

      - name: Run TFLint (modules/security-groups)
        run: tflint --chdir=modules/security-groups

      - name: Run TFLint (modules/alb)
        run: tflint --chdir=modules/alb

      - name: Run TFLint (modules/ec2)
        run: tflint --chdir=modules/ec2

      - name: Run TFLint (modules/rds)
        run: tflint --chdir=modules/rds
