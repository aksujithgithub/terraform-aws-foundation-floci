name: Terragrunt CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "local"
        type: choice
        options: [local]
      action:
        description: "Terragrunt action"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

# Prevent concurrent deploys to the same environment
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'local' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Validate — runs on every PR and push
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "1.0.0"

      - name: Terraform Format Check (modules)
        run: terraform fmt -check -recursive modules/

      - name: Terragrunt validate (local env — all stacks)
        run: |
          terragrunt run --all validate \
            --working-dir environments/local \
            --non-interactive \
            --config root.hcl

  # ---------------------------------------------------------------------------
  # TFLint — runs on every PR and push
  # ---------------------------------------------------------------------------
  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint (modules/network)
        run: tflint --chdir=modules/network --config=../.tflint.hcl

      - name: Run TFLint (modules/iam)
        run: tflint --chdir=modules/iam --config=../.tflint.hcl

      - name: Run TFLint (modules/security-groups)
        run: tflint --chdir=modules/security-groups --config=../.tflint.hcl

      - name: Run TFLint (modules/alb)
        run: tflint --chdir=modules/alb --config=../.tflint.hcl

      - name: Run TFLint (modules/ec2)
        run: tflint --chdir=modules/ec2 --config=../.tflint.hcl

      - name: Run TFLint (modules/rds)
        run: tflint --chdir=modules/rds --config=../.tflint.hcl

  # ---------------------------------------------------------------------------
  # Plan — runs on every PR to show what would change
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: [validate, tflint]
    # Run on PRs, or manual trigger with action=plan
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'local' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "1.0.0"

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: latest

      - name: Terragrunt init
        run: |
          terragrunt run --all init \
            --working-dir environments/${{ env.ENVIRONMENT }} \
            --non-interactive \
            --config root.hcl

      - name: Terragrunt plan
        run: |
          terragrunt run --all plan \
            --working-dir environments/${{ env.ENVIRONMENT }} \
            --non-interactive \
            --config root.hcl \
            -- -out=tfplan

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: "**/.terragrunt-cache/**/tfplan"
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Apply — runs automatically on merge to main, or manually
  # ---------------------------------------------------------------------------
  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: [validate, tflint]
    # Auto-apply on push to main; or manual trigger with action=apply
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'local' }}

    # Require manual approval for non-local environments (add via GitHub environment protection rules)
    environment: ${{ github.event.inputs.environment || 'local' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "1.0.0"

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: latest

      - name: Terragrunt init
        run: |
          terragrunt run --all init \
            --working-dir environments/${{ env.ENVIRONMENT }} \
            --non-interactive \
            --config root.hcl

      - name: Terragrunt apply
        run: |
          terragrunt run --all apply \
            --working-dir environments/${{ env.ENVIRONMENT }} \
            --non-interactive \
            --config root.hcl \
            -- -auto-approve

      - name: Collect outputs
        run: |
          echo "## Deploy Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### ALB" >> $GITHUB_STEP_SUMMARY
          terragrunt output \
            --working-dir environments/${{ env.ENVIRONMENT }}/alb \
            --config root.hcl 2>/dev/null >> $GITHUB_STEP_SUMMARY || true

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Network" >> $GITHUB_STEP_SUMMARY
          terragrunt output \
            --working-dir environments/${{ env.ENVIRONMENT }}/network \
            --config root.hcl 2>/dev/null >> $GITHUB_STEP_SUMMARY || true

          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Smoke test — health check
        run: |
          ALB_DNS=$(terragrunt output -raw alb_dns_name \
            --working-dir environments/${{ env.ENVIRONMENT }}/alb \
            --config root.hcl 2>/dev/null)

          echo "ALB DNS: $ALB_DNS"

          # Retry up to 10 times (EC2 user_data takes a moment to start Flask)
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/health || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 10 attempts"
          exit 1

  # ---------------------------------------------------------------------------
  # Destroy — manual only, requires explicit action=destroy input
  # ---------------------------------------------------------------------------
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'local' }}

    environment: ${{ github.event.inputs.environment || 'local' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "1.0.0"

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: latest

      - name: Terragrunt init
        run: |
          terragrunt run --all init \
            --working-dir environments/${{ env.ENVIRONMENT }} \
            --non-interactive \
            --config root.hcl

      - name: Terragrunt destroy
        run: |
          terragrunt run --all destroy \
            --working-dir environments/${{ env.ENVIRONMENT }} \
            --non-interactive \
            --config root.hcl \
            -- -auto-approve
