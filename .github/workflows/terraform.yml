name: Terragrunt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "1.0.0"

      - name: Terraform Format Check (modules)
        run: terraform fmt -check -recursive modules/

      - name: Terragrunt validate (local env — all stacks)
        run: |
          terragrunt run --all validate \
            --working-dir environments/local \
            --non-interactive \
            --config root.hcl

  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint (modules/network)
        run: tflint --chdir=modules/network

      - name: Run TFLint (modules/iam)
        run: tflint --chdir=modules/iam
